# ============================================================================
#  US Visa (India · B2) appointment watcher — configuration
#  Copy this file to `config.properties` and fill in your values.
#  config.properties is git-ignored. NEVER commit your real credentials.
#  Any key can also be set as an env var: portal.email -> PORTAL_EMAIL
# ============================================================================

# ---- Your portal account ---------------------------------------------------
portal.email=you@example.com
portal.password=your-portal-password

# Base URL of YOUR portal. India B2 currently uses usvisascheduling.com.
# The older system many bots target is ais.usvisa-info.com.
# VERIFY by logging in and copying the domain from your browser.
portal.baseUrl=https://www.usvisascheduling.com
# Only used by the ais.usvisa-info.com flow (country/locale segment). Ignored otherwise.
portal.localePath=en-ca
# Your existing schedule/appointment id — copy it from the URL after logging in.
portal.scheduleId=

# Consulates to watch as  id=Name,id=Name  (get IDs from the consulate dropdown).
# Example India facility IDs for the usvisa-info system shown below — VERIFY yours.
portal.facilities=122=Mumbai,123=New Delhi,124=Chennai,125=Hyderabad,126=Kolkata

# reCAPTCHA site key (data-sitekey on the page). Leave blank to auto-detect.
portal.recaptchaSiteKey=

# ---- Search criteria -------------------------------------------------------
# Only slots within [earliest, latest] are considered. earliest defaults to today.
search.earliest=2026-07-01
search.latest=2026-12-31
# Restrict to specific facility IDs (comma-separated). Blank = all of portal.facilities.
search.facilities=
# false = only notify you when a slot opens. true = auto-book the first match.
search.autoBook=false

# ---- Polling ---------------------------------------------------------------
poll.intervalSeconds=180
poll.jitterSeconds=60
# Show the browser window (recommended while tuning). true = run hidden.
browser.headless=false

# ---- CAPTCHA solving -------------------------------------------------------
# mode options:
#   manual   = FREE. When a reCAPTCHA appears, the app pauses and you solve it
#              once in the visible browser window (requires browser.headless=false).
#              Because the login session is cached, this is rarely needed.
#   2captcha = paid API, fully automated (set captcha.apiKey below).
#   none     = do nothing (submissions will fail if a captcha is shown).
captcha.mode=manual
# How long to wait for you to solve it manually before giving up (seconds).
captcha.manualTimeoutSeconds=300
# Only needed when captcha.mode=2captcha:
captcha.apiKey=

# ---- Email notifications (Gmail needs an App Password, not your login) ------
email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.smtp.username=you@gmail.com
email.smtp.password=your-16-char-app-password
email.from=you@gmail.com
email.to=you@gmail.com

# ---- SMS notifications (Twilio) --------------------------------------------
twilio.accountSid=
twilio.authToken=
twilio.fromNumber=+1XXXXXXXXXX
twilio.toNumber=+9198XXXXXXXX

